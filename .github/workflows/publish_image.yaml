name: Publish image on commit or published release

on:
  push:
    branches:
      - master
      - main
      - CFBOT-Discord
  release:
    types:
      - published

permissions:
  contents: write # create the tag and release on a push to main
  packages: write # push the image to GHCR

# Two pushes to main in quick succession would otherwise race for the same
# date tag and one of them would fail to create its release. Queue instead.
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Work out the version and image tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [ "${{ github.ref_name }}" = "CFBOT-Discord" ]; then
            # Match CFBOT-Discord branch, but tag the image as :cfbot
            echo "CREATE_RELEASE=false" >> "$GITHUB_ENV"
            
            # Set single TAG for the local build/test step
            echo "TAG=${IMAGE}:cfbot" >> "$GITHUB_ENV"
            
            # Set TAGS for the final registry push
            echo "TAGS<<EOF" >> "$GITHUB_ENV"
            echo "${IMAGE}:cfbot" >> "$GITHUB_ENV"
            echo "${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"

          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF##*/}"
            echo "CREATE_RELEASE=false" >> "$GITHUB_ENV"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
            echo "TAG=${IMAGE}:${VERSION}" >> "$GITHUB_ENV"
            echo "TAGS<<EOF" >> "$GITHUB_ENV"
            echo "${IMAGE}:${VERSION}" >> "$GITHUB_ENV"
            echo "${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
            if [ "${{ github.event.release.prerelease }}" != "true" ]; then
              echo "${IMAGE}:latest" >> "$GITHUB_ENV"
            fi
            echo "EOF" >> "$GITHUB_ENV"

          else
            BASE="v$(date -u +'%Y.%m.%d')"
            TAKEN="$(git ls-remote --tags origin | sed 's#.*refs/tags/##; s#\^{}##' | sort -u)"
            VERSION="$BASE"
            N=1
            while printf '%s\n' "$TAKEN" | grep -qx -- "$VERSION"; do
              VERSION="${BASE}.${N}"
              N=$((N + 1))
            done
            echo "CREATE_RELEASE=true" >> "$GITHUB_ENV"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
            echo "TAG=${IMAGE}:${VERSION}" >> "$GITHUB_ENV"
            echo "TAGS<<EOF" >> "$GITHUB_ENV"
            echo "${IMAGE}:${VERSION}" >> "$GITHUB_ENV"
            echo "${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "${IMAGE}:latest" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: Build image
        uses: docker/build-push-action@v4
        with:
          load: true
          push: false
          tags: ${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          docker run ${{ env.TAG }} /bin/sh -c "\
          python -m pip install --upgrade pip && \
          pip install -r requirements.txt && \
          pip install -r requirements-test.txt && \
          pytest"

      - name: Upload coverage from image (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-image-coverage
          path: coverage.xml
        continue-on-error: true

      - name: Push image to registry
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha

      # Last, so a build or test failure never leaves a release pointing at an
      # image that was never published. Creating this with GITHUB_TOKEN is
      # deliberate: releases made with it do not trigger workflows, so this
      # cannot re-enter the release: published path above and build twice.
      - name: Tag and release
        if: env.CREATE_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
